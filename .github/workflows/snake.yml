name: Generate snake animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate light and dark snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Vinil-Official
          outputs: |
            dist/github-snake.svg?color_dots=#0A101F,#A7F3D0,#6EE7B7,#34D399,#10B981
            dist/github-snake-dark.svg?color_dots=#2d3343,#155E75,#0891B2,#22D3EE,#10B981

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
